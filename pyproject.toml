[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-nfce"
version = "1.0.0"
description = "Robo de consulta de NFC-e por UF, extracao de textos capturados e leitura de SPED EFD."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyAutoGUI==0.9.54",
    "Pyperclip==1.9.0",
    "Pillow==11.2.1",
    "pytesseract==0.3.13",
    "SpeechRecognition==3.14.3",
    "playwright==1.54.0",
]

[project.optional-dependencies]
audio = ["PyAudio==0.2.14"]

[project.scripts]
robo-nfce = "robo_nfce.cli:main"

[tool.setuptools.packages.find]
include = ["robo_nfce*"]
